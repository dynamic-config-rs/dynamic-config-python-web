name: Security

# Advisories are published on someone else's schedule, so this runs on one of
# its own as well as on every change. A dependency that was clean on Monday is
# not necessarily clean on Friday, and nothing about this repository has to
# change for that to happen.
#
# That matters more here than anywhere else in the organisation: this is the
# one distribution whose dependency graph is somebody else's web framework —
# nine of them — and a web framework is where advisories actually land.
#
# No push trigger for `dev` — same reasoning as ci.yml: dev travels through
# pull requests, and a push twin under required checks poisons the gate.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# A push during a run makes the older run's answer obsolete.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  osv:
    name: advisories, every ecosystem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # 3.13 rather than 3.12 would leave django-bolt out of the
          # resolution entirely — its marker is `>=3.12` and it is one of
          # the two youngest packages here, which is to say one of the two
          # most worth scanning. 3.13 satisfies every marker this package
          # has, so it resolves the widest graph.
          python-version: "3.13"
      # The binary, pinned and checksummed like every other download here.
      # An action would be one more third party in a job about third parties.
      - name: install osv-scanner
        run: |
          curl -sSL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64
          echo "edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c  osv-scanner" \
            | sha256sum -c -
          chmod +x osv-scanner
      # No lockfile is committed here, and none should be — a library that
      # pinned its dependencies would pin its users'. What is auditable is
      # what somebody installing today actually resolves, so it is resolved
      # here and the frozen result is what gets scanned.
      - name: resolve what the extras install
        run: python scripts/resolve-web-audit.py /tmp/audit-venv /tmp/web-requirements.txt
      # `|| true`, and the classification is the next step's: the scanner
      # exits non-zero for *any* finding, and an unmaintained package with no
      # published fix is not something a pull request here can answer.
      # Failing on those is how a gate becomes one people learn to ignore.
      - name: scan
        run: |
          ./osv-scanner scan source \
            --lockfile "requirements.txt:/tmp/web-requirements.txt" \
            --format json --output osv.json || true
      # Fails on anything with a fix available, warns on anything without
      # one, and writes both halves into the job summary either way.
      - name: report
        run: python scripts/audit-report.py osv.json "$GITHUB_STEP_SUMMARY"

  supply-chain:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Flags a pull request that adds a dependency with a known advisory or a
      # licence outside the allow-list, at the point where changing course is
      # still cheap. Adding a framework extra is exactly that kind of change.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure

  published:
    name: the published wheel is still pure
    # Schedule and dispatch only: this asks PyPI, not the tree, so a pull
    # request cannot change its answer — but a compromised upload can, and
    # a weekly read is how that is noticed here rather than in an issue.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: what PyPI serves imports no framework
        run: |
          pip install --quiet dynamic-config-py-web
          python - <<'CHECK'
          import sys

          import dynamic_config_web

          frameworks = {
              "django", "django_bolt", "fastapi", "flask",
              "litestar", "quart", "rest_framework", "robyn", "starlette",
          }
          arrived = sorted(n for n in sys.modules if n.split(".")[0] in frameworks)

          assert not arrived, f"the published wheel pulled in {arrived}"
          print(f"pure, at {dynamic_config_web.__version__}")
          CHECK

  # The one status branch protection requires from this workflow — same
  # reasoning as CI's gate. `supply-chain` IS in the needs even though it only
  # exists on pull requests: the gate's own check tolerates `skipped`, so a
  # plain push passes, while a PR with a failing dependency review is blocked
  # — which is the whole point of running it.
  security-ok:
    name: Security is green
    needs: [osv, supply-chain, published]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job this gate needs has succeeded
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "$results"
          case "$results" in
            *failure*|*cancelled*) exit 1 ;;
          esac
