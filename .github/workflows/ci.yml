name: CI

# No push trigger at all: everything travels through a pull request, and
# main only ever receives a SQUASH of a green PR — the squashed tree is
# byte-identical to the PR head the checks already ran on, so a main
# re-run would test the same content twice. Merging runs release.yml
# alone; workflow_dispatch stays as the manual escape hatch.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What changed, so the expensive jobs below can sit out a run that cannot
  # affect them. Deliberately a *job* rather than `on.pull_request.paths`:
  # a workflow filtered out at the trigger never reports at all, and a
  # required check that never reports leaves the pull request waiting for
  # ever. A skipped job passes the gate instead — `ci-ok` matches `failure`
  # and `cancelled` only, which the `supply-chain` job in security.yml has
  # relied on since it was written.
  # Filtering applies to pull requests only. A push to `main` and a manual
  # dispatch run everything: `main` is what releases from, and a manual
  # dispatch has no base commit for a path filter to compare against.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - '.github/workflows/**'
            docs:
              - '**/*.md'
              - 'book/**'
              - '.github/workflows/**'

  lint:
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name != 'pull_request'
    name: lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          # No requirements.txt in this repository; without a path to
          # hash, setup-python fails the step rather than skipping the cache.
          cache-dependency-path: pyproject.toml
      - run: pip install ruff
      # Over the package, the suite and the examples — an example is code
      # people copy, so it is held to the same rules.
      - run: ruff check .
      - run: ruff format --check .

  core:
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name != 'pull_request'
    name: the shared core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every interpreter this package claims. The *core* is what has to
        # work on all of them: an adapter only has to work where its
        # framework does, which is the `adapters` job below. Claiming a
        # floor and testing only the ceiling is how a floor quietly stops
        # being true.
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          # No requirements.txt in this repository; without a path to
          # hash, setup-python fails the step rather than skipping the cache.
          cache-dependency-path: pyproject.toml
      # `[test]` and nothing else: no framework at all. That is the whole
      # point of this job — the core is usable, and importing it pulls in
      # nothing.
      - run: pip install -e ".[test]"
      - run: python -m pytest tests/test_core.py tests/test_packaging.py -q
      # The claim the extras make, from the outside: a fresh interpreter,
      # the package, and an assertion about `sys.modules`.
      - name: importing the package imports no framework
        run: |
          python - <<'PY'
          import sys

          import dynamic_config_web

          frameworks = {
              "django", "django_bolt", "fastapi", "flask",
              "litestar", "quart", "rest_framework", "robyn", "starlette",
          }
          arrived = sorted(n for n in sys.modules if n.split(".")[0] in frameworks)

          assert not arrived, f"importing the package pulled in {arrived}"
          print(f"clean, at {dynamic_config_web.__version__}")
          PY

  adapters:
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name != 'pull_request'
    name: ${{ matrix.framework }} on ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One row per framework, at an interpreter that framework supports —
        # not a product. Seven frameworks × six interpreters would be
        # forty-two jobs, most of them impossible cells: django-bolt needs
        # 3.12, Robyn needs 3.10, and the newest Quart needs 3.11.
        #
        # Two rows for each Beta adapter — the newest interpreter and the
        # oldest its framework runs on — because a floor tested only at the
        # ceiling is a floor nobody is checking. The Experimental two get
        # one row each, at the only interpreter they support.
        include:
          - { framework: fastapi, python: "3.12", extra: "fastapi" }
          - { framework: fastapi, python: "3.9", extra: "fastapi" }
          - { framework: litestar, python: "3.12", extra: "litestar" }
          - { framework: litestar, python: "3.9", extra: "litestar" }
          - { framework: flask, python: "3.12", extra: "flask" }
          - { framework: flask, python: "3.9", extra: "flask" }
          # Quart 0.21 needs 3.11; on 3.9 the extra's floor resolves to an
          # older Quart, and this row is what proves that still works.
          - { framework: quart, python: "3.12", extra: "quart" }
          - { framework: quart, python: "3.9", extra: "quart" }
          # Django 5 needs 3.10, so the 3.9 row resolves to Django 4.2 —
          # which is the LTS this package claims and the one most projects
          # are on.
          - { framework: django, python: "3.12", extra: "django" }
          - { framework: django, python: "3.9", extra: "django" }
          - { framework: drf, python: "3.12", extra: "drf" }
          - { framework: drf, python: "3.10", extra: "drf" }
          # django-ninja declares 3.7 upwards, so both ends of this
          # package's own range are fair game.
          - { framework: ninja, python: "3.12", extra: "ninja" }
          - { framework: ninja, python: "3.9", extra: "ninja" }
          # Robyn's wheels start at 3.10, whatever its metadata says.
          - { framework: robyn, python: "3.12", extra: "robyn" }
          # django-bolt requires 3.12 and its extra carries the marker, so
          # any other row here would install nothing and skip silently.
          - { framework: django_bolt, python: "3.12", extra: "django-bolt" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          # No requirements.txt in this repository; without a path to
          # hash, setup-python fails the step rather than skipping the cache.
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[test,${{ matrix.extra }}]"
      # `--strict-markers` and an explicit file: a conformance run that
      # skipped itself because the framework was missing would be a green
      # job proving nothing, and this job exists to prove that one thing.
      - run: python -m pytest tests/conformance/test_${{ matrix.framework }}.py -q --strict-markers
      - name: the suite did not skip itself
        run: |
          collected=$(python -m pytest tests/conformance/test_${{ matrix.framework }}.py \
            --collect-only -q | tail -1)
          echo "$collected"
          case "$collected" in
            *"no tests ran"*|*"0 tests"*) echo "::error::nothing ran"; exit 1 ;;
          esac

  django-app:
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name != 'pull_request'
    name: the path a Django project takes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The `ninja` extra brings Django with it, and covers the one case
      # here that needs django-ninja. A conformance row installs one
      # framework and drives the adapter directly; this file stands up a
      # real project instead — `INSTALLED_APPS`, `AppConfig.ready()`, the
      # autoreloader's two processes — which no row reaches.
      - run: pip install -e ".[test,ninja]"
      - run: python -m pytest tests/test_django_app.py -q --strict-markers
      # And the packaging rows the `core` job has to skip: `django.drf` and
      # `django.ninja` assert that an adapter names its extra when its API
      # layer is missing, which only means anything where Django itself is
      # present. This is the only job where it is.
      - run: python -m pytest tests/test_packaging.py -q --strict-markers
      # Every case here is meant to run in this environment. One that
      # skipped itself would be a green job proving less than it looks.
      - name: nothing skipped itself
        run: |
          skipped=$(python -m pytest tests/test_django_app.py -q -rs \
            | grep -c '^SKIPPED' || true)
          echo "skipped: $skipped"
          test "$skipped" -eq 0 || {
            echo "::error::a case skipped itself"
            exit 1
          }

  types:
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name != 'pull_request'
    name: the types a caller sees
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          # No requirements.txt in this repository; without a path to
          # hash, setup-python fails the step rather than skipping the cache.
          cache-dependency-path: pyproject.toml
      # Every framework, the Experimental two included: `[all]` leaves
      # them out for a *user*, and a type check that skipped the two
      # youngest adapters would be checking the wrong half.
      - run: pip install -e ".[dev,all,robyn,django-bolt]"
      - run: mypy --strict src/dynamic_config_web/
      # And again with none of them, which is the environment most users
      # type-check in: the overrides must cover every framework import.
      - name: and with no framework installed
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install --quiet -e ".[dev]"
          /tmp/bare/bin/mypy --strict src/dynamic_config_web/

  examples:
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name != 'pull_request'
    name: every example runs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          # No requirements.txt in this repository; without a path to
          # hash, setup-python fails the step rather than skipping the cache.
          cache-dependency-path: pyproject.toml
      # Including the Experimental two, because there is an example per
      # framework and every one of them runs here.
      - run: pip install -e ".[test,all,robyn,django-bolt]"
      # An example that only compiles is not an example. Each writes into a
      # temporary directory and needs no setup.
      - name: every example
        run: |
          set -euo pipefail
          for example in examples/[0-9]*.py; do
            echo "→ $example"
            python "$example" > /dev/null
          done

  coverage:
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name != 'pull_request'
    name: coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Every framework, so the number covers the adapters too — the same
      # environment the `types` job builds.
      - run: pip install -e ".[dev,all,robyn,django-bolt]" pytest-cov
      - run: |
          python -m pytest tests -q \
            --cov=dynamic_config_web --cov-report=term \
            --cov-report=json:coverage.json
      - name: the number, where reviews can see it
        run: |
          python - <<'REPORT' >> "$GITHUB_STEP_SUMMARY"
          import json

          covered = json.load(open("coverage.json"))["totals"]["percent_covered"]
          print(f"line coverage: {covered:.1f}%")
          REPORT

  book:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || github.event_name != 'pull_request'
    name: the book builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Digest-verified: a binary whose output is published to a website
      # deserves the same suspicion an action gets.
      - name: install mdbook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o mdbook.tar.gz \
            https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz
          echo "c0b903f01dd8f4edc644372ad2b80b1fdddd12552d37b6a098657cbd8eddd768  mdbook.tar.gz" | sha256sum -c -
          tar -xzf mdbook.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mdbook build book
      - run: test -f book/book/index.html

  docs-links:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || github.event_name != 'pull_request'
    name: documentation links resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A README is the first thing anyone reads and the last thing anyone
      # tests. A dead anchor in it is a small bug that is very easy to ship.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --include-fragments
            --max-retries 3
            --retry-wait-time 5
            --exclude '^https://github\.com/dynamic-config-rs/'
            --exclude '^https://dynamic-config-rs\.github\.io'
            --exclude '^https://pypi\.org/project/dynamic-config-py'
            README.md CONTRIBUTING.md SECURITY.md AGENTS.md CHANGELOG.md
            book/src/*.md
          fail: true

  actionlint:
    name: workflows lint clean
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  # The one status branch protection requires. Requiring every job by name
  # breaks the moment a matrix row is renamed; requiring this gate never
  # does. `if: always()` because a gate that is skipped when a dependency
  # fails would count as "not failed" and wave the merge through.
  ci-ok:
    name: CI is green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [changes, lint, core, adapters, django-app, types, examples, coverage, book, docs-links, actionlint]
    steps:
      - name: every job succeeded
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "$results"
          case "$results" in
            *failure*|*cancelled*) exit 1 ;;
          esac
