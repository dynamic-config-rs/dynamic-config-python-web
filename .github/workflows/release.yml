name: Release

# Releases are managed through the pull-request pipeline, not by hand-pushed
# tags: merging a version-bump PR into `main` IS the release. Every push to
# `main` lands here; the `decide` job checks whether the version is new, and
# everything downstream is skipped when it is not — so a docs merge is a
# green no-op and a version bump is a release.
#
# The tag is an *output* of a successful publish, minted by CI at the merge
# commit. Since `main` only accepts pull requests that passed the gates, a
# release inherits the whole review pipeline by construction.
#
# One distribution and no compiled artefact: a pure-Python wheel and an
# sdist, built once on one runner. There is no wheel matrix here because
# there is nothing platform-specific to build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decide:
    name: is this a release?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: check
        run: |
          # Where `[tool.hatch.version]` reads it from, so the tag and the
          # published metadata cannot disagree.
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' \
            src/dynamic_config_web/__init__.py | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new — this push is a release."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: sdist and wheel
    needs: [decide]
    if: needs.decide.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      # A wheel that installs and then fails on a missing module is the
      # failure this catches, and it is cheap: install the built artefact
      # into a clean environment with no framework at all and import it.
      # That is also the purity claim, checked against the *wheel* rather
      # than against the source tree.
      - name: the wheel installs and imports clean
        run: |
          set -euo pipefail
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          /tmp/fresh/bin/python - <<'PY'
          import sys

          import dynamic_config_web

          frameworks = {
              "django", "django_bolt", "fastapi", "flask",
              "litestar", "quart", "rest_framework", "robyn", "starlette",
          }
          arrived = sorted(n for n in sys.modules if n.split(".")[0] in frameworks)

          assert not arrived, f"the wheel pulled in {arrived}"
          print(f"clean, at {dynamic_config_web.__version__}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist

  publish:
    name: publish to PyPI
    needs: [decide, build]
    if: needs.decide.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Trusted publishing: PyPI verifies THIS workflow's OIDC identity —
      # no PYPI_TOKEN to store, leak or rotate. The `dynamic-config-py-web`
      # project carries a Trusted Publisher entry on PyPI naming this
      # repository and this file; OUTSTANDING.md spells the console entry.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      # `skip-existing`: a version on PyPI is permanent, so the only way
      # forward after a partial failure is a rerun that publishes the
      # remainder. `release-web.sh --check` is what keeps that from being
      # the normal case.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

  tag-and-release:
    name: tag and GitHub release
    needs: [decide, publish]
    if: needs.decide.outputs.release == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The tag marks what was actually published: minted only after PyPI
      # has it, at the merge commit that did it.
      - name: tag the release
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "dynamic-config-py-web $VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

      - name: notes from the changelog
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          # The section for this version, up to the next one.
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " || $0 ~ "^## " v "$" { found = 1; next }
            found && /^## /  { exit }
            found            { print }
          ' CHANGELOG.md > release-notes.md

          echo "--- notes ---"
          cat release-notes.md

      # An SBOM, attached to the release rather than gating it. Seven
      # framework extras is a wide graph, and "what is in this" deserves an
      # answer in the format the question is usually asked in.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: the bill of materials
        continue-on-error: true
        run: |
          mkdir -p sbom

          pip install --quiet cyclonedx-bom
          # The same resolution the advisory scan audits, so the two
          # answers cannot drift: what a user installing today gets.
          python scripts/resolve-web-audit.py /tmp/sbom-venv /tmp/sbom-requirements.txt
          cyclonedx-py requirements /tmp/sbom-requirements.txt \
            --of JSON -o sbom/dynamic-config-py-web.cdx.json

          ls -la sbom

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ needs.decide.outputs.version }}
          name: v${{ needs.decide.outputs.version }}
          body_path: release-notes.md
          files: sbom/*.cdx.json
